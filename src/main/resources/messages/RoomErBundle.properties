state.empty.title=No Room schema files found
state.empty.body=Room ER reads the schema JSON files that Room exports at build time. To export them, set exportSchema = true on your @Database class and tell Room where to write the files with room.schemaLocation:
state.empty.snippet=// build.gradle.kts (module)\nplugins {\n    id("androidx.room")\n}\n\nroom {\n    schemaDirectory("$projectDir/schemas")\n}\n\n// or, without the Room Gradle plugin:\nksp {\n    arg("room.schemaLocation", "$projectDir/schemas")\n}
state.empty.after=Then build the project. The files appear as schemas/<database class>/<version>.json and the diagram opens automatically. If your schemas are kept somewhere else, choose the folder yourself.
state.folder.empty.title=No Room schema files in {0}
state.folder.empty.body=The chosen folder contains no files named <version>.json in a database folder. Pick the "schemas" folder, one of the database folders inside it, or a folder above them.
