group=com.oguzhanaslann.roomer
version=0.1.0

kotlin.code.style=official
# The IntelliJ Platform ships the Kotlin stdlib; do not bundle a second copy.
kotlin.stdlib.default.dependency=false

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true

# Android Studio release the plugin is built against when no local IDE is configured
# (latest stable: Rabbit 2 | 2026.2.2 Patch 1). To build against an installed IDE instead (no download), put
#   platformLocalPath=/Applications/Android Studio.app
# into local.properties.
androidStudioVersion=2026.2.2.9
# 261 = Android Studio Quail (2026.1), the older of the two supported stable lines (NFR-02).
pluginSinceBuild=261

# Plugin verifier targets (AC-22.1): the latest release of each of the two supported stable lines,
# Rabbit 2026.2 (262) and Quail 2026.1 (261). Versions come from the Android Studio releases list
# (https://jb.gg/android-studio-releases-list.xml). Update when a new stable line ships.
pluginVerifierIdes=2026.2.2.9,2026.1.4.8
