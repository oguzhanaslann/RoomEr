name: Release

# Push a tag that matches the version in gradle.properties to release it:
#   git tag v0.0.2 && git push origin v0.0.2
# The workflow tests and verifies the plugin, publishes it to JetBrains Marketplace and attaches the zip
# to a GitHub release. A version with a pre-release label (0.1.0-eap.1) goes to the Marketplace "eap"
# channel and becomes a GitHub pre-release.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   PUBLISH_TOKEN         JetBrains Marketplace token. Without it, Marketplace publishing is skipped.
#   CERTIFICATE_CHAIN     Optional plugin signing certificate chain (PEM).
#   PRIVATE_KEY           Optional signing private key (PEM).
#   PRIVATE_KEY_PASSWORD  Optional password of the private key.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check that the tag matches the plugin version
        id: version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and check
        run: ./gradlew check buildPlugin

      - name: Plugin verifier
        run: ./gradlew verifyPlugin

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::warning::PUBLISH_TOKEN is not set; skipping Marketplace publishing."
            exit 0
          fi
          ./gradlew publishPlugin

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="build/distributions/RoomEr-$VERSION.zip"
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "RoomEr $VERSION" --notes-file notes.md $prerelease
          fi
